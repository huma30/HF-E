name: Order Group Upgrade CI

on:
  push:
    branches:
      - upgrade-order-group-modifier
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Automated tests
        run: npm test

      - name: Validate Firestore Rules
        run: npx firebase-tools emulators:exec --only firestore --project demo-huma-order-group "node -e \"console.log('Firestore Rules compiled successfully')\""
